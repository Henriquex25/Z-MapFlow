name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: App / Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Go formatting
        run: test -z "$(git ls-files '*.go' -z | xargs -0 gofmt -l)"
      - run: go test -race -tags webkit2_41 ./...
      - run: go vet -tags webkit2_41 ./...
      - name: Install matching Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Check generated API bindings
        run: |
          python3 scripts/wails.py generate module -tags webkit2_41
          git diff --ignore-space-at-eol --exit-code -- frontend/wailsjs/go
      - name: Build desktop
        run: python3 scripts/wails.py build -tags webkit2_41 -skipbindings -m -nosyncgomod
      - name: Installer and release contract
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm run build --prefix docs
