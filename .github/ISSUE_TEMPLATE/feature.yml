name: Suggest an improvement
description: Propose a feature or usability improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired behavior
      description: Concrete examples and alternatives help evaluate the idea.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Include official ZMK documentation or examples where relevant.
