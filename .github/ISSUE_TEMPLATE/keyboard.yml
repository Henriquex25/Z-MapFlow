name: Add keyboard support
description: Propose a keyboard plugin.
title: "[Keyboard]: "
body:
  - type: input
    id: name
    attributes:
      label: Keyboard model and hardware revision
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Controllers, layout and features
      description: Include encoders, sensors, split topology and public hardware references.
    validations:
      required: true
  - type: textarea
    id: zmk
    attributes:
      label: Existing ZMK support
      description: Link shields, modules, example keymaps and the build matrix. See the plugin guide in the documentation.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Availability to test on physical hardware
