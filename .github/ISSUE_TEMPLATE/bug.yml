name: Report a bug
description: A problem with the app, keymap import or firmware builds.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Z-MapFlow version and operating system
      description: The app version appears in the header.
      placeholder: "Version from header; Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Keyboard, controller and variant
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove credentials and personal information before attaching files. Include the ZMK revision for firmware problems.
